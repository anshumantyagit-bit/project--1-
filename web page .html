<!DOCTYPE html>
<html>
<head>
    <title>My Courses</title>

    <style>
        body {
            background-color: #b5d3df;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            margin-top: 30px;
        }

        .courses {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .card {
            background-color: #fcf9f9;
            width: 180px;
            padding: 15px;
            border: 2px solid #cdc5c6;
            border-radius: 8px;
        }

        .card h2 {
            font-size: 20px;
        }

        .card p {
            font-size: 13px;
        }

        button {
            width: 150px;
            padding: 8px;
            background-color: #17156b;
            color: white;
            border: none;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <h1>MY COURSES</h1>

    <div class="courses">

        <div class="card">
            <h2>HTML</h2>
            <p>Learn the basics of HTML and create your first webpage.</p>
            <button>Learn More</button>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Learn colors, fonts, borders and beautiful webpage styling.</p>
            <button>Learn More</button>
        </div>

        <div class="card">
            <h2>JavaScript</h2>
            <p>Learn JavaScript and make your webpages interactive.</p>
            <button>Learn More</button>
        </div>

    </div>

    <p>Keep Your Discovering!</p>

</body>
</html>
